[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lighthouse-batch"
version = "1.0.0"
description = "Batch Lighthouse / PageSpeed Insights scores for Site Audit. Never invents scores."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Site Audit" }]
keywords = ["lighthouse", "pagespeed", "psi", "audit", "cli", "web-vitals"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/jrynks/lighthouse-batch"

[project.scripts]
lighthouse-batch = "lighthouse_batch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["lighthouse_batch*"]
exclude = ["tests*", "src*", "scripts*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
